name: CI

# Один конвейер для любой ветки: проверки кода и инфраструктуры -> сборка образа ОДИН раз ->
# сканирование и дымовой тест этого образа -> публикация в GHCR именно этого образа.
# Деплой (только main) запускает deploy.yml по завершении этого workflow.

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # В main прогоны не отменяем: каждый коммит main должен получить свой образ и деплой.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.8.5"

jobs:
  # ---------------------------------------------------------------- статические проверки
  lint:
    name: Lint (black, isort, flake8, bandit, shellcheck, hadolint, actionlint)
    # Для веток этого же репозитория с открытым PR push уже запустил CI — не дублируем.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pre-commit hooks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      - name: Run linters
        run: pre-commit run --all-files --hook-stage push --show-diff-on-failure

  secrets-scan:
    name: Secrets scan (gitleaks)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (pip-audit)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off

  iac:
    name: IaC checks (terraform, ansible, kubernetes, trivy)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: Terraform validate (terraform/aws)
        run: |
          terraform -chdir=terraform/aws init -backend=false -input=false
          terraform -chdir=terraform/aws validate

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ansible lint (production profile)
        run: |
          pip install ansible-lint==26.10.1
          ansible-galaxy collection install -r ansible/requirements.yml
          cd ansible && ansible-lint playbook.yml

      - name: Kubernetes manifests (kubeconform)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tgz" | sha256sum -c -
          tar xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 -ignore-missing-schemas \
            k8s/etcd.yaml k8s/services.yaml k8s/networkpolicy.yaml k8s/patroni.yaml k8s/migrate-job.yaml \
            k8s/classapp-web.yaml k8s/classapp-nginx.yaml k8s/hpa.yaml

      - name: Security scan of IaC, Dockerfile and manifests (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          skip-dirs: infra

  # ---------------------------------------------------------------- тесты и миграции
  test:
    name: Tests (pytest, ${{ matrix.db }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg2://postgres:postgres@localhost:5432/classapp_test' || 'sqlite:///test_classapp.db' }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests with coverage (minimum 70%)
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml --cov-report=term --cov-fail-under=70

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ matrix.db }}
          path: reports/
          retention-days: 14

  migrations:
    name: Migrations (alembic on PostgreSQL)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classapp_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/classapp_migrations
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply all migrations to an empty database
        run: python -m alembic upgrade head

      - name: Models and migrations must not diverge
        run: python -m alembic check

      - name: Migrations are reversible (downgrade to base, upgrade again)
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

  # ---------------------------------------------------------------- образ
  build:
    name: Build, scan, smoke-test and publish image
    needs: [lint, secrets-scan, dependency-audit, iac, test, migrations]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless-подпись аттестаций (OIDC GitHub)
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (once)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: classapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: classapp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Smoke test (same restrictions as in Kubernetes)
        run: |
          set -euo pipefail
          docker network create ci
          docker run -d --name pg --network ci \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=classapp postgres:15-alpine
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -U postgres -d classapp >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec pg pg_isready -U postgres -d classapp

          DB_URL="postgresql://postgres:postgres@pg:5432/classapp"
          HARDEN="--user 1000:1000 --read-only --cap-drop ALL --security-opt no-new-privileges"

          # миграции выполняются внутри того же образа, который поедет в прод
          # shellcheck disable=SC2086
          docker run --rm --network ci $HARDEN --tmpfs /tmp \
            -e DATABASE_URL="$DB_URL" --entrypoint python classapp:ci -m alembic upgrade head

          # shellcheck disable=SC2086
          docker run -d --name app --network ci -p 8000:8000 $HARDEN \
            --tmpfs /tmp --tmpfs /var/log/classapp:rw,uid=1000,gid=1000,mode=0755 \
            -e SECRET_KEY=ci-secret -e DB_PASSWORD=postgres -e DATABASE_URL="$DB_URL" \
            -e ADMIN_PHONE=375290000000 -e ADMIN_PASSWORD=ci-admin-password \
            classapp:ci gunicorn -w 1 -b 0.0.0.0:8000 "app:create_app()"

          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:8000/healthz | tee /tmp/health.json
          grep -q '"database":"ok"' /tmp/health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"phone":"375290000000","password":"ci-admin-password"}' http://127.0.0.1:8000/api/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/tasks)" = "401"
          echo "smoke test passed"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs app 2>&1 | tail -80 || true
          docker logs pg 2>&1 | tail -20 || true

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: classapp:ci
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        id: publish
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER,,}/classapp"
          safe_branch="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g' | cut -c1-40)"
          tag="${safe_branch}-${COMMIT_SHA}"
          docker tag classapp:ci "${repo}:${tag}"
          docker push "${repo}:${tag}"
          if [ "$REF_NAME" = "main" ]; then
            docker tag classapp:ci "${repo}:latest"
            docker push "${repo}:latest"
          fi
          # Неизменяемый идентификатор образа: деплой берёт образ по дайджесту, а не по тегу
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${repo}:${tag}" | cut -d@ -f2)"
          {
            echo "image=${repo}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Образ опубликован"
            echo "\`${repo}:${tag}\`"
            echo "дайджест: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance (who built this image, from which commit)
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM (what is inside this image)
        if: github.event_name == 'push'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

  # ---------------------------------------------------------------- уведомление
  notify:
    name: Notify CI result
    needs: [lint, secrets-scan, dependency-audit, iac, test, migrations, build]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULTS: ${{ join(needs.*.result, ',') }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID не заданы — уведомление пропущено"
            exit 0
          fi
          if echo "$RESULTS" | grep -Eq "failure|cancelled"; then
            STATUS="❌ FAILED"
          else
            STATUS="✅ SUCCESS"
          fi
          curl -fsS --max-time 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=CI ${STATUS} — classapp
          Branch: ${REF_NAME}
          Commit: ${COMMIT_SHA}
          By: ${ACTOR}
          Run: ${RUN_URL}" \
            || echo "::warning::Не удалось отправить уведомление в Telegram"
