name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality (Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Cache Pre-Commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-py3.11-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-py3.11-precommit-
            ${{ runner.os }}-precommit-

      - name: Install Lint Tools
        run: pip install pre-commit

      - name: Run Linters (push stage)
        run: pre-commit run --all-files --hook-stage push --show-diff-on-failure || true

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      FLASK_CONFIG: config.DevConfig
      TEST_DATABASE_URL: sqlite:///test_classapp.db
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-dotenv pytest-cov

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

  build-check:
    name: Build image (validation only, no push)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: classapp:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify CI result
    runs-on: ubuntu-latest
    needs: [lint, test, build-check]
    if: always()
    steps:
      - name: Send Telegram notification
        run: |
          if echo "${{ join(needs.*.result, ',') }}" | grep -q "failure"; then
            STATUS="❌ FAILED"
          else
            STATUS="✅ SUCCESS"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="CI ${STATUS} — classapp
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          By: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"