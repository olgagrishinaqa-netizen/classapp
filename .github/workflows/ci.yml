name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality (Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # Автоматическое кэширование зависимостей pip

      - name: Cache Pre-Commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-precommit-

      - name: Install Lint Tools
        run: pip install pre-commit

      - name: Run Linters
        run: pre-commit run --all-files

  test:
    name: Run Unit Tests
    needs: lint # Тесты не запустятся, пока линтер выдает ошибки
    runs-on: ubuntu-latest
    services:
      # Поднимаем временную тестовую базу данных PostgreSQL прямо в памяти CI
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: classapp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Ждем, пока Postgres будет готов принимать соединения
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest # ставим фреймворк для тестов, если его еще нет

      - name: Run Tests
        env:
          FLASK_CONFIG: config.DevConfig
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/classapp_test
          SECRET_KEY: test-secret-key
        run: |
          # Когда добавите тесты, раскомментируйте строку ниже:
          # pytest
          echo "Тесты успешно пройдены (заглушка)"
