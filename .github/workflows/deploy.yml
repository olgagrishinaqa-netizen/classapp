name: Deploy to Production VM

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Запускаем деплой через современный и безопасный SSH-экшен
      - name: SSH Remote Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # 1. Создаем чистую рабочую директорию проекта
            sudo mkdir -p /opt/classapp
            sudo chown -R $USER:$USER /opt/classapp
            cd /opt/classapp

            # 2. Пишем docker-compose.prod.yml напрямую на сервере Яндекса
            cat > docker-compose.prod.yml <<'YML'
            services:
              db:
                image: postgres:15
                restart: unless-stopped
                environment:
                  POSTGRES_DB: classapp
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: ${DB_PASSWORD}
                volumes:
                  - classapp_prod_db_data:/var/lib/postgresql/data
                expose:
                  - "5432"
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres -d classapp"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              web:
                image: ghcr.io/${REPO_OWNER}/classapp:${IMAGE_TAG}
                restart: unless-stopped
                ports:
                  - "80:8000"
                command: gunicorn -w 2 -b 0.0.0.0:8000 wsgi:app
                environment:
                  FLASK_CONFIG: config.ProdConfig
                  SECRET_KEY: ${SECRET_KEY}
                  DATABASE_URL: postgresql+psycopg2://postgres:${DB_PASSWORD}@db:5432/classapp
                depends_on:
                  db:
                    condition: service_healthy

            volumes:
              classapp_prod_db_data:
            YML

            # 3. Генерируем файл переменных окружения .env
            cat > .env <<ENV
            REPO_OWNER=${{ github.repository_owner }}
            IMAGE_TAG=${{ github.sha }}
            SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
            DB_PASSWORD=${{ secrets.APP_DB_PASSWORD }}
            ENV

            # 4. Принудительно приводим имя владельца репозитория к нижнему регистру для Docker
            export REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            sed -i "s/\${REPO_OWNER}/$REPO_OWNER_LOWER/g" docker-compose.prod.yml

            # 5. Скачиваем свежие сборки и разворачиваем стек контейнеров
            export $(cat .env | xargs)
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # 6. Умное ожидание: проверяем готовность контейнера БД перед миграциями
            echo "⏱️ Ожидаем готовности базы данных..."
            until docker compose -f docker-compose.prod.yml exec -T db pg_isready -U postgres -d classapp; do
              sleep 2
            done

            # 7. Безопасно применяем миграции Alembic (теперь памяти хватит с запасом)
            echo "🚀 Запуск миграций базы данных..."
            docker compose -f docker-compose.prod.yml exec -T web alembic upgrade head

            echo "🚀 Деплой успешно завершен! Приложение работает на http://${{ secrets.SSH_HOST }}"
