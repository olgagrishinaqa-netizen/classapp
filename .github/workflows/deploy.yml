name: Deploy to Production VM

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"] # Должно точно совпадать с именем в build.yml
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/classapp"

      - name: SSH Remote Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            sudo mkdir -p /opt/classapp
            sudo chown -R $USER:$USER /opt/classapp
            cd /opt/classapp

            [ -f docker-compose.prod.yml ] || mv docker-compose.prod.yml/docker-compose.prod.yml . || true

            # Генерируем .env подтягивая метаданные из гитхаба
            cat > .env <<YML
            REPO_OWNER=${{ github.repository_owner }}
            IMAGE_TAG=${{ github.sha }}
            SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
            DB_PASSWORD=${{ secrets.APP_DB_PASSWORD }}
            YML

            # Подменяем путь к образу в docker-compose на лету
            sed -i "s|cr.yandex/\${REGISTRY_ID}/classapp|ghcr.io/${{ github.repository_owner }}/classapp|g" docker-compose.prod.yml

            # Опционально: если ваш репозиторий GitHub приватный, раскомментируйте строку ниже для авторизации на ВМ:
            # echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d

            sleep 5
            docker compose --env-file .env -f docker-compose.prod.yml exec -T web alembic upgrade head
