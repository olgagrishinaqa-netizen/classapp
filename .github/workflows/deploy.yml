name: Deploy to Production

# Единственный путь автоматического деплоя. Запускается после успешного CI на main
# и берёт именно тот образ main-<sha>, который CI собрал, проверил и опубликовал.
# Вручную (если коммит пришёл, когда ВМ была выключена по расписанию): Actions -> Run workflow.
#
# Секреты: SSH_HOST (IP ВМ), SSH_KEY (приватный ключ), SSH_KNOWN_HOSTS (отпечаток ВМ, см. make github-secrets),
# необязательные SSH_PORT, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Полный SHA коммита, образ main-<sha> которого уже есть в GHCR"
        required: true

permissions:
  contents: read
  packages: read # читать образ в GHCR (дайджест)
  attestations: read # проверять подпись происхождения образа

# Два деплоя одновременно недопустимы; начатый деплой не прерываем.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      OWNER: ${{ github.repository_owner }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: Validate inputs
        run: |
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::COMMIT_SHA должен быть полным SHA коммита (40 hex-символов)"; exit 1
          fi
          if [ -z "$SSH_HOST" ]; then echo "::error::секрет SSH_HOST пуст"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Resolve image digest (immutable id of the image to deploy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/classapp"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          digest="$(docker buildx imagetools inspect "${image}:main-${COMMIT_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::не удалось получить дайджест образа ${image}:main-${COMMIT_SHA} (образ ещё не опубликован?)"; exit 1
          fi
          echo "IMAGE_DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "Образ: ${image}@${digest}"

      - name: Verify image provenance (built by our CI from this repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://ghcr.io/${OWNER,,}/classapp@${IMAGE_DIGEST}" \
            --repo "$REPO" --signer-workflow "${REPO}/.github/workflows/ci.yml"

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/classapp_deploy_key"
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Секрет SSH_KNOWN_HOSTS не задан: без отпечатка ВМ подключаться небезопасно. Выполните 'make github-secrets'."
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<SSHCONF
          Host prod
            HostName $SSH_HOST
            Port $SSH_PORT
            User ubuntu
            IdentityFile $HOME/.ssh/classapp_deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 10
            ServerAliveCountMax 6
            ControlMaster auto
            ControlPath $HOME/.ssh/cm-%C
            ControlPersist 15m
          SSHCONF
          chmod 600 "$HOME/.ssh/config"

      - name: Wait for SSH to become responsive
        run: |
          set -uo pipefail
          for attempt in $(seq 1 8); do
            if ssh prod true >/tmp/ssh_attempt.log 2>&1; then
              echo "SSH доступен (попытка $attempt)"
              exit 0
            fi
            echo "Попытка $attempt/8 не удалась:"; tail -3 /tmp/ssh_attempt.log | sed 's/^/    /'
            sleep 15
          done
          echo "::error::SSH недоступен. Если ВМ выключена по расписанию — запустите её (make start) и перезапустите workflow."
          exit 1

      - name: Skip if this commit is already deployed
        run: |
          deployed="$(ssh prod 'cat /var/lib/classapp-deploy/deployed_sha 2>/dev/null || true')"
          if [ "$deployed" = "$COMMIT_SHA" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "::notice::Коммит ${COMMIT_SHA} уже выкачен на ВМ — повторный деплой пропущен."
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
          fi

      - name: Upload manifests and deploy scripts
        if: env.SKIP_DEPLOY != 'true'
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5; do
            if tar czf - k8s scripts/pull-deploy \
              | ssh prod "sudo mkdir -p /opt/classapp/repo /var/log/classapp /var/log/nginx && sudo chown -R ubuntu:ubuntu /opt/classapp && tar xzf - -C /opt/classapp/repo"; then
              exit 0
            fi
            echo "Попытка $n не удалась, повтор через 15 с"; sleep 15
          done
          exit 1

      - name: Deploy to K3s
        if: env.SKIP_DEPLOY != 'true'
        run: |
          set -euo pipefail
          image_repo="${OWNER,,}/classapp"
          for n in 1 2 3; do
            # shellcheck disable=SC2029  # значения подставляются на клиенте намеренно (SHA провалидирован)
            if ssh prod "sudo IMAGE_REPO='${image_repo}' IMAGE_DIGEST='${IMAGE_DIGEST}' SRC_DIR=/opt/classapp/repo bash /opt/classapp/repo/scripts/pull-deploy/deploy-steps.sh '${COMMIT_SHA}'"; then
              exit 0
            fi
            echo "Попытка $n не удалась, повтор через 20 с"; sleep 20
          done
          exit 1

      - name: Verify from outside (public entry point)
        run: |
          curl -fsS --max-time 15 --retry 10 --retry-delay 6 --retry-connrefused --retry-all-errors "http://${SSH_HOST}/healthz"

      - name: Notify deploy result
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID не заданы — уведомление пропущено"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then STATUS="✅ SUCCESS"; else STATUS="❌ FAILED"; fi
          curl -fsS --max-time 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=Deploy ${STATUS} — classapp
          Commit: ${COMMIT_SHA}
          Run: ${RUN_URL}" \
            || echo "::warning::Не удалось отправить уведомление в Telegram"
