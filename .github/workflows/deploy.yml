name: Deploy to Production VM

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- НОВЫЙ ДИАГНОСТИЧЕСКИЙ ШАГ (FAIL-FAST) ---
      - name: Check SSH port availability (Fail-Fast)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_HOST" ]; then
            echo "❌ Error: SSH_HOST secret is empty. Check your GitHub Repository Secrets."
            exit 1
          fi

          echo "Checking TCP port 22 on configured SSH host: $SSH_HOST..."
          if nc -vz -w 10 "$SSH_HOST" 22; then
            echo "✅ Connection successful! Port 22 is open and reachable."
          else
            echo "❌ Connection failed! Target host $SSH_HOST is NOT reachable on port 22."
            echo "👉 Please check if your VM is running and port 22 is allowed for 0.0.0.0/0 in Yandex Cloud Security Groups."
            exit 1
          fi

      - name: Prepare server directories and log folders
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            sudo mkdir -p /opt/classapp
            sudo mkdir -p /opt/classapp/monitoring
            sudo mkdir -p /opt/classapp/provisioning/datasources
            sudo mkdir -p /opt/classapp/provisioning/dashboards
            sudo mkdir -p /opt/classapp/provisioning/dashboards_json
            sudo mkdir -p /var/log/classapp /var/log/nginx
            sudo chown -R ubuntu:ubuntu /opt/classapp
            sudo chmod -R 777 /var/log/classapp /var/log/nginx

      - name: Copy compose, proxy and observability config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml,docker-compose.logging.yml,nginx.conf,promtail-config.yml,monitoring/prometheus.yml,provisioning/datasources/loki.yml,provisioning/dashboards/dashboards.yml,provisioning/dashboards_json/classapp_dashboard.json"
          target: "/opt/classapp"

      - name: Deploy production web and logging stacks
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: APP_SECRET_KEY,APP_DB_PASSWORD,GRAFANA_ADMIN_PASSWORD
          script: |
            set -e

            if [ -z "$APP_SECRET_KEY" ] || [ -z "$APP_DB_PASSWORD" ]; then
              echo "❌ Missing required deploy secrets"
              exit 1
            fi

            cd /opt/classapp
            REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            cat << ENV > .env
            REPO_OWNER=${REPO_OWNER_LOWER}
            IMAGE_TAG=main-${{ github.event.workflow_run.head_sha }}
            SECRET_KEY=${APP_SECRET_KEY}
            DB_PASSWORD=${APP_DB_PASSWORD}
            GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
            ENV
            chmod 600 .env

            echo "Pulling production images..."
            docker compose -f docker-compose.prod.yml pull
            echo "Pulling logging images..."
            docker compose -f docker-compose.logging.yml pull

            echo "Starting PostgreSQL..."
            docker compose -f docker-compose.prod.yml up -d db

            echo "Waiting for PostgreSQL database to be ready..."
            for i in {1..30}; do
              if docker compose -f docker-compose.prod.yml exec -T db pg_isready -U postgres -d classapp; then
                echo "Database is ready!"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ Database did not become ready in time"
                exit 1
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm -T -e PYTHONPATH=/app web alembic upgrade head

            echo "Starting production web stack..."
            docker compose -f docker-compose.prod.yml up -d web nginx prometheus

            echo "Starting logging stack..."
            docker compose -f docker-compose.logging.yml up -d

            echo "Pruning unused images..."
            docker image prune -f

            echo "🚀 Dual-compose deploy completed successfully!"
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      - name: Notify deploy result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ SUCCESS"
          else
            STATUS="❌ FAILED"
          fi

          TEXT=$(cat << EOF
          Deploy ${STATUS} — classapp
          Host: ${{ secrets.SSH_HOST }}
          Commit: ${{ github.event.workflow_run.head_sha }}
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id heat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${TEXT}"