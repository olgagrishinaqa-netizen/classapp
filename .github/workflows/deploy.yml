name: Deploy to Production VM1

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Runner MTU Network Issues
        run: |
          echo "🌐 Оптимизируем MTU для прохождения SSH Handshake в WSL2..."
          sudo ip link set dev eth0 mtu 1400 || true

      - name: Prepare SSH key for retry-wrapped actions
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          cat > "$HOME/.ssh/classapp_deploy_key" <<'EOF'
          ${{ secrets.SSH_KEY }}
          EOF
          chmod 600 "$HOME/.ssh/classapp_deploy_key"

      - name: Wait for SSH to become responsive
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ]; then
            echo "❌ Error: SSH_HOST secret is empty."
            exit 1
          fi
          SSH_OPTS="-i $HOME/.ssh/classapp_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes -o ServerAliveInterval=2 -o ServerAliveCountMax=3 -o TCPKeepAlive=yes"
          echo "DIAG SSH_HOST value (spaced to bypass masking): $(printf '%s' "$SSH_HOST" | sed 's/./& /g') | length=${#SSH_HOST}"
          echo "DIAG runner egress IP: $(curl -s --max-time 5 https://ifconfig.me || echo unknown)"
          if nc -z -w 8 158.160.48.121 22; then echo "DIAG hardcoded 158.160.48.121:22 open"; else echo "DIAG hardcoded 158.160.48.121:22 CLOSED/filtered"; fi
          echo "Waiting for real SSH login on $SSH_HOST..."
          for attempt in $(seq 1 30); do
            if ssh -v $SSH_OPTS ubuntu@"$SSH_HOST" "true" >/tmp/ssh_attempt.log 2>&1; then
              echo "✅ SSH is responsive (attempt $attempt)."
              exit 0
            fi
            echo "⏳ Attempt $attempt/30 failed, retrying... last ssh output:"
            grep -vE "^debug1: (Reading|Applying|identity|Local|Authenticating)" /tmp/ssh_attempt.log | tail -6 | sed 's/^/    /'
            if nc -z -w 5 "$SSH_HOST" 22; then echo "    tcp/22: open"; else echo "    tcp/22: CLOSED/filtered"; fi
            sleep 20
          done
          echo "❌ SSH timeout."
          exit 1

      - name: Prepare server directories and secure log folders
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/classapp_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh $SSH_OPTS ubuntu@"$SSH_HOST" '
            set -e
            sudo mkdir -p /opt/classapp/k8s /var/log/classapp /var/log/nginx
            sudo chown -R ubuntu:ubuntu /opt/classapp /var/log/classapp /var/log/nginx
            sudo chmod -R 755 /var/log/classapp /var/log/nginx
          '

      - name: Copy configurations and K8s manifests to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/classapp_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          tar czf - nginx.conf promtail-config.yml monitoring/prometheus.yml provisioning k8s \
            | ssh $SSH_OPTS ubuntu@"$SSH_HOST" "tar xzf - -C /opt/classapp"

      - name: Native Kubernetes Deployment Stack
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/classapp_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh $SSH_OPTS ubuntu@"$SSH_HOST" "GRAFANA_ADMIN_PASSWORD='$GRAFANA_ADMIN_PASSWORD' bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/classapp
          
          KUBE="sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl"
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          K8S_IMAGE="ghcr.io/${REPO_OWNER_LOWER}/classapp:main-${COMMIT_SHA}"
          
          echo "☸️ ШАГ 1: Снятие ограничений планировщика с мастер-ноды..."
          $KUBE version --client
          $KUBE taint nodes --all node-role.kubernetes.io/master:NoSchedule- || true
          $KUBE taint nodes --all node-role.kubernetes.io/control-plane:NoSchedule- || true
          
          echo "☸️ ШАГ 2: Применение манифестов СУБД..."
          $KUBE apply -f /opt/classapp/k8s/etcd.yaml
          $KUBE apply -f /opt/classapp/k8s/services.yaml
          
          PATRONI_APPLY_ERR=$(mktemp)
          if ! $KUBE apply -f /opt/classapp/k8s/patroni.yaml 2>"$PATRONI_APPLY_ERR"; then
            if grep -q "updates to statefulset spec.*are forbidden" "$PATRONI_APPLY_ERR"; then
              echo "ℹ️ Пересборка StatefulSet через orphan-поды..."
              $KUBE scale statefulset/classapp-patroni --namespace default --replicas=0 || true
              $KUBE delete statefulset classapp-patroni --namespace default --cascade=orphan
              $KUBE apply -f /opt/classapp/k8s/patroni.yaml
            else
              cat "$PATRONI_APPLY_ERR" && rm -f "$PATRONI_APPLY_ERR" && exit 1
            fi
          fi
          rm -f "$PATRONI_APPLY_ERR"
          
          echo "⏳ ШАГ 3: Ожидание готовности Patroni СУБД..."
          for i in $(seq 1 45); do
            MASTER_ENDPOINTS=$($KUBE get endpoints classapp-db-master -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
            if [ -n "${MASTER_ENDPOINTS:-}" ]; then
              echo "✅ Лидер Patroni найден: ${MASTER_ENDPOINTS}"
              break
            fi
            sleep 4
          done
          
          echo "☸️ ШАГ 4: Генерация секретов и database-url..."
          DB_PASSWORD_B64="$($KUBE get secret classapp-secrets -o jsonpath='{.data.db-password}' 2>/dev/null || true)"
          SECRET_KEY_B64="$($KUBE get secret classapp-secrets -o jsonpath='{.data.secret-key}' 2>/dev/null || true)"
          ADMIN_PHONE_B64="$($KUBE get secret classapp-secrets -o jsonpath='{.data.admin-phone}' 2>/dev/null || true)"
          ADMIN_PASSWORD_B64="$($KUBE get secret classapp-secrets -o jsonpath='{.data.admin-password}' 2>/dev/null || true)"

          DB_PASSWORD="$(printf '%s' "$DB_PASSWORD_B64" | base64 -d)"
          SECRET_KEY="$(printf '%s' "$SECRET_KEY_B64" | base64 -d)"
          
          ENCODED_DB_PASSWORD="$(DB_PASSWORD="$DB_PASSWORD" python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')"
          DATABASE_URL="postgresql://postgres:${ENCODED_DB_PASSWORD}@classapp-db-master:5432/classapp?sslmode=require"

          SECRET_ARGS=(--from-literal=db-password="$DB_PASSWORD" --from-literal=secret-key="$SECRET_KEY" --from-literal=database-url="$DATABASE_URL")
          if [ -n "${ADMIN_PHONE_B64}" ]; then SECRET_ARGS+=(--from-literal=admin-phone="$(printf '%s' "$ADMIN_PHONE_B64" | base64 -d)"); fi
          if [ -n "${ADMIN_PASSWORD_B64}" ]; then SECRET_ARGS+=(--from-literal=admin-password="$(printf '%s' "$ADMIN_PASSWORD_B64" | base64 -d)"); fi

          $KUBE create secret generic classapp-secrets --namespace default "${SECRET_ARGS[@]}" --dry-run=client -o yaml | $KUBE apply -f -

          echo "☸️ ШАГ 5: Запуск миграций Alembic..."
          $KUBE delete job classapp-migrate --ignore-not-found=true
          if [ -f /opt/classapp/k8s/migrate-job.yaml ]; then
            sed "s#ghcr.io/olgagrishinaqa-netizen/classapp:latest#${K8S_IMAGE}#g" /opt/classapp/k8s/migrate-job.yaml | $KUBE apply -f -
            $KUBE wait --for=condition=complete job/classapp-migrate --timeout=300s
          fi

          echo "☸️ ШАГ 6: Деплой веб-приложения..."
          if [ -f /opt/classapp/k8s/kustomization.yaml ]; then
            sed -i "s#newTag:.*#newTag: main-${COMMIT_SHA}#" /opt/classapp/k8s/kustomization.yaml
            $KUBE apply -k /opt/classapp/k8s
          else
            $KUBE apply -f /opt/classapp/k8s/classapp-web.yaml
            $KUBE apply -f /opt/classapp/k8s/classapp-nginx.yaml
          fi
          $KUBE set image deployment/classapp-web classapp-web="$K8S_IMAGE"
          $KUBE rollout status deployment/classapp-web --timeout=300s

          echo "⏳ ШАГ 7: Проверка доступности веб-сервера..."
          sleep 10
          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 http://127.0.0 >/dev/null 2>&1; then
              echo "🚀 ДЕПЛОЙ В KUBERNETES УСПЕШНО ЗАВЕРШЕН!"
              break
            fi
            sleep 4
          done

          echo "🧹 ШАГ 8: Очистка старых Docker слоев..."
          sudo journalctl --vacuum-time=7d >/dev/null 2>&1 || true
          if sudo k3s crictl images >/dev/null 2>&1; then
            UNREF_IMAGES="$(sudo k3s crictl images -q --unreferenced || true)"
            if [ -n "${UNREF_IMAGES}" ]; then sudo k3s crictl rmi ${UNREF_IMAGES} >/dev/null 2>&1 || true; fi
          fi
          EOF

      - name: Notify deploy result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then STATUS="✅ SUCCESS"; else STATUS="❌ FAILED"; fi
          TEXT=$(cat << EOF
          Deploy ${STATUS} — classapp
          Host: ${{ secrets.SSH_HOST }}
          Commit: ${{ github.event.workflow_run.head_sha }}
          EOF
          )
          curl -s -X POST "https://telegram.org{{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${TEXT}"
