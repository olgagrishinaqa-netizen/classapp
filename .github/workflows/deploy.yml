name: Deploy to Production VM

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose & monitoring config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,monitoring/prometheus.yml"
          target: "/opt/classapp"

      - name: SSH Remote Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          envs: APP_SECRET_KEY,APP_DB_PASSWORD,GRAFANA_ADMIN_PASSWORD
          script: |
            set -e
            test -n "$APP_SECRET_KEY"
            test -n "$APP_DB_PASSWORD"
            sudo mkdir -p /opt/classapp
            sudo chown -R $USER:$USER /opt/classapp
            cd /opt/classapp

            REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            cat > .env <<ENV
            REPO_OWNER=${REPO_OWNER_LOWER}
            IMAGE_TAG=main-${{ github.event.workflow_run.head_sha }}
            SECRET_KEY=$APP_SECRET_KEY
            DB_PASSWORD=$APP_DB_PASSWORD
            GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
            ENV

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            sleep 5
            docker compose -f docker-compose.prod.yml exec -T -e PYTHONPATH=/app web alembic upgrade head

            echo "🚀 Деплой завершён: http://${{ secrets.SSH_HOST }}"
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      - name: Notify deploy result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then STATUS="✅ SUCCESS"; else STATUS="❌ FAILED"; fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Deploy ${STATUS} — classapp
          Host: ${{ secrets.SSH_HOST }}
          Commit: ${{ github.event.workflow_run.head_sha }}"
