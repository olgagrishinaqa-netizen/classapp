name: Deploy to Production VM1

# SSH_HOST — публичный IP master-1 (terraform output master1_static_ip).
# Необязательный секрет SSH_PORT — альтернативный порт sshd (по умолчанию 22).
# Канал Azure (раннеры GitHub) -> Yandex Cloud нестабилен: поэтому одно
# мультиплексируемое SSH-соединение, IPQoS=none и повторы на каждом шаге.
# Логика самого деплоя — scripts/pull-deploy/deploy-steps.sh (общая с pull-вариантом).

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fix Runner MTU Network Issues
        run: sudo ip link set dev eth0 mtu 1400 || true

      - name: Prepare SSH config
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ]; then echo "❌ SSH_HOST secret is empty"; exit 1; fi
          install -m 700 -d "$HOME/.ssh"
          cat > "$HOME/.ssh/classapp_deploy_key" <<'EOF'
          ${{ secrets.SSH_KEY }}
          EOF
          chmod 600 "$HOME/.ssh/classapp_deploy_key"
          cat > "$HOME/.ssh/config" <<EOF
          Host prod
            HostName $SSH_HOST
            Port $SSH_PORT
            User ubuntu
            IdentityFile $HOME/.ssh/classapp_deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IPQoS none
            ConnectTimeout 20
            ConnectionAttempts 3
            ServerAliveInterval 10
            ServerAliveCountMax 6
            TCPKeepAlive yes
            ControlMaster auto
            ControlPath $HOME/.ssh/cm-%C
            ControlPersist 15m
          EOF
          chmod 600 "$HOME/.ssh/config"
          echo "DIAG runner egress IP: $(curl -s --max-time 5 https://ifconfig.me || echo unknown)"

      - name: DIAG probe ports from runner
        run: |
          for p in 22 80 443 2222 3000 30080 30300 30900; do
            printf 'port %-6s ' "$p"
            timeout 8 bash -c "exec 3<>/dev/tcp/$SSH_HOST/$p" 2>&1 && echo "OPEN" || echo "closed/refused/timeout (exit $?)"
          done
          echo "--- other Yandex Cloud endpoints (443) ---"
          for h in storage.yandexcloud.net compute.api.cloud.yandex.net ya.ru; do
            printf '%-36s ' "$h"
            timeout 8 bash -c "exec 3<>/dev/tcp/$h/443" 2>&1 && echo "OPEN" || echo "closed/timeout (exit $?)"
          done
          echo "--- traceroute ---"
          (command -v traceroute >/dev/null || sudo apt-get install -y -qq traceroute >/dev/null 2>&1)
          timeout 60 traceroute -n -T -p 22 -w 2 -m 20 "$SSH_HOST" 2>&1 | tail -22 || true

      - name: Wait for SSH to become responsive
        run: |
          set -uo pipefail
          for attempt in $(seq 1 30); do
            if ssh -v prod true >/tmp/ssh_attempt.log 2>&1; then
              echo "✅ SSH is responsive (attempt $attempt)."
              exit 0
            fi
            echo "⏳ Attempt $attempt/30 failed. Last ssh output:"
            grep -vE "^debug1: (Reading|Applying|identity|Local|Authenticating|/etc)" /tmp/ssh_attempt.log | tail -5 | sed 's/^/    /'
            sleep 15
          done
          echo "❌ SSH did not become responsive."
          exit 1

      - name: Upload manifests and deploy scripts
        run: |
          set -euo pipefail
          retry() {
            local n
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "⚠️ Attempt $n failed, retrying in 15s..."
              sleep 15
            done
            return 1
          }
          retry bash -c '
            tar czf - k8s scripts/pull-deploy \
              | ssh prod "sudo mkdir -p /opt/classapp/repo /var/log/classapp /var/log/nginx && sudo chown -R ubuntu:ubuntu /opt/classapp && tar xzf - -C /opt/classapp/repo"
          '

      - name: Deploy to K3s
        run: |
          set -euo pipefail
          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          retry() {
            local n
            for n in 1 2 3; do
              "$@" && return 0
              echo "⚠️ Attempt $n failed, retrying in 20s..."
              sleep 20
            done
            return 1
          }
          retry ssh prod "sudo IMAGE_REPO='${OWNER_LOWER}/classapp' SRC_DIR=/opt/classapp/repo bash /opt/classapp/repo/scripts/pull-deploy/deploy-steps.sh '${COMMIT_SHA}'"

      - name: Notify deploy result
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] || exit 0
          if [ "${{ job.status }}" = "success" ]; then STATUS="✅ SUCCESS"; else STATUS="❌ FAILED"; fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=Deploy ${STATUS} — classapp
          Commit: ${COMMIT_SHA}" || true
