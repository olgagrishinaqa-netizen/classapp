name: Build and Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

# КРИТИЧЕСКИ ВАЖНО: Даем пайплайну официальное право записывать Docker-образы в репозиторий
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: classapp

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Переводим имя владельца репозитория в нижний регистр, чтобы избежать синтаксических ошибок Docker
      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
