name: Build and Push to YCR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ycr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: classapp

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Универсальный, нативный способ логина: БЕЗ yc, БЕЗ капризных плагинов Яндекса.
      # В username передаем ID ключа YCA..., в password - secret YCNoF...
      - name: Login to Yandex Container Registry
        run: |
          echo "${{ secrets.YC_SA_KEY_JSON }}" | docker login --username YCAJE6_vRZ-rrOh71kLjSNwFN --password-stdin cr.yandex

      - name: Build and Push to YCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            cr.yandex/${{ secrets.YCR_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            cr.yandex/${{ secrets.YCR_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
