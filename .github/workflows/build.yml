name: Build and Push to YCR

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: classapp

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Yandex Cloud Authorize
        uses: yandex-cloud/yc-github-actions/authorize@v1
        with:
          key-json: ${{ secrets.YC_SA_KEY_JSON }}

      - name: Login to Yandex Container Registry
        uses: yandex-cloud/yc-github-actions/cr-login@v1

      - name: Build and Push to YCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            cr.yandex/${{ secrets.YCR_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            cr.yandex/${{ secrets.YCR_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
