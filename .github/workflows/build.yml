name: Build and Push to GHCR

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  # У workflow_run github.ref — всегда default-ветка, поэтому группируем по ветке коммита.
  group: ghcr-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

# КРИТИЧЕСКИ ВАЖНО: Даем пайплайну официальное право записывать Docker-образы в репозиторий
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: classapp

jobs:
  build:
    name: Build and Push Docker Image
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Собираем именно проверенный CI коммит (а не default-ветку).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve commit metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
            BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          else
            COMMIT_SHA="${{ github.sha }}"
            BRANCH_NAME="${{ github.ref_name }}"
          fi

          SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "safe_branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

      # Переводим имя владельца репозитория в нижний регистр, чтобы избежать синтаксических ошибок Docker
      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.safe_branch }}-${{ steps.meta.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 'latest' обновляем только с main — без пересборки, просто доп. тег на тот же манифест
      - name: Tag as latest (main only)
        if: steps.meta.outputs.branch_name == 'main'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest \
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.safe_branch }}-${{ steps.meta.outputs.commit_sha }}

      - name: Notify build result
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID не заданы — уведомление пропущено"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then STATUS="✅ SUCCESS"; else STATUS="❌ FAILED"; fi
          curl -fsS --max-time 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=Build ${STATUS} — classapp
          Branch: ${{ steps.meta.outputs.branch_name }}
          Image: ${{ steps.meta.outputs.safe_branch }}-${{ steps.meta.outputs.commit_sha }}" \
            || echo "::warning::Не удалось отправить уведомление в Telegram"
