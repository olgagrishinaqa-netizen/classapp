name: Build and Push to GHCR

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

# КРИТИЧЕСКИ ВАЖНО: Даем пайплайну официальное право записывать Docker-образы в репозиторий
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: classapp

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Переводим имя владельца репозитория в нижний регистр, чтобы избежать синтаксических ошибок Docker
      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      # Тег по ветке — нужен, т.к. теперь сборка идёт на любую ветку, а не только main
      - name: Sanitize branch name for tag
        id: branch_tag
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "safe_branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.branch_tag.outputs.safe_branch }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 'latest' обновляем только с main — без пересборки, просто доп. тег на тот же манифест
      - name: Tag as latest (main only)
        if: github.ref_name == 'main'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest \
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.branch_tag.outputs.safe_branch }}-${{ github.sha }}

      - name: Notify build result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then STATUS="✅ SUCCESS"; else STATUS="❌ FAILED"; fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Build ${STATUS} — classapp
          Branch: ${{ github.ref_name }}
          Image: ${{ steps.branch_tag.outputs.safe_branch }}-${{ github.sha }}"
