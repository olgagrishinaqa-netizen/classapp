name: Build and Push to YCR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ycr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: classapp

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Устанавливаем yc CLI в домашнюю директорию пользователя, где гарантированно есть права
      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://yandexcloud.net | bash -s -- -n
          echo "/home/runner/yandex-cloud/bin" >> $GITHUB_PATH

      # Используем точный путь в домашнем каталоге для вызова yc
      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' > sa_key.json
          /home/runner/yandex-cloud/bin/yc config set service-account-key sa_key.json
          /home/runner/yandex-cloud/bin/yc iam create-token | docker login --username iam --password-stdin cr.yandex
          rm sa_key.json

      - name: Build and Push to YCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            cr.yandex/${{ secrets.YCR_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            cr.yandex/${{ secrets.YCR_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
