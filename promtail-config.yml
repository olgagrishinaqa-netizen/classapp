server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: flask-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: flask-app
          service: classapp
          __path__: /var/log/flask_logs/app.json.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            path: path
            line: line
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02 15:04:05,000"
            - "2006-01-02 15:04:05"
      - output:
          source: message

  - job_name: nginx-web
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-web
          service: nginx
          __path__: /var/log/nginx_logs/access.json.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            status: status
            method: request_method
            uri: request_uri
            remote_addr: remote_addr
            upstream_response_time: upstream_response_time
      - labels:
          status:
          method:
          uri:
      - output:
          source: uri
