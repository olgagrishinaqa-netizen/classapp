<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Класс | Управление{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { forest: '#315f4c', ink: '#17251f', mist: '#f6f8f5' } } } };
  </script>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <meta name="theme-color" content="#315f4c">
  {% block head %}{% endblock %}
</head>
<body class="bg-mist text-ink">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="flex w-64 shrink-0 flex-col justify-between border-r border-ink/10 bg-white px-4 py-6">
      <div>
        <!-- Logo -->
        <div class="mb-8 flex items-center gap-3 px-2">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-forest text-lg font-semibold text-white">К</div>
          <div class="leading-tight">
            <p class="text-sm font-semibold text-ink">Класс</p>
            <p class="text-xs text-ink/50">рабочее пространство</p>
          </div>
        </div>

        <!-- Navigation: замените href="#" на реальные url_for(...) под ваши роуты -->
        <nav class="space-y-1">
          <a href="#"
             class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-white bg-forest">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5Z" />
            </svg>
            Дашборд
          </a>

          <a href="#"
             class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-ink/70 transition hover:bg-mist hover:text-ink">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
            </svg>
            <span class="flex-1">Задачи</span>
            <span class="flex h-5 min-w-5 items-center justify-center rounded-full bg-forest px-1 text-xs font-semibold text-white">1</span>
          </a>

          <a href="#"
             class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-ink/70 transition hover:bg-mist hover:text-ink">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5m6 0v1a3 3 0 1 1-6 0v-1m6 0H9" />
            </svg>
            Новости
          </a>

          <a href="#"
             class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-ink/70 transition hover:bg-mist hover:text-ink">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 19V5m0 14h16M8 19v-6m4 6V9m4 10v-4" />
            </svg>
            Отчетность
          </a>

          <a href="#"
             class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-ink/70 transition hover:bg-mist hover:text-ink">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1m18 0v-1a4 4 0 0 0-3-3.87M14 3.13a4 4 0 0 1 0 7.75M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
            </svg>
            Пользователи
          </a>
        </nav>
      </div>

      <!-- Profile block -->
      <div class="border-t border-ink/10 pt-4">
        <div class="flex items-center gap-3 px-2">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-forest/10 text-sm font-semibold text-forest">А</div>
          <div class="min-w-0 flex-1 leading-tight">
            <p class="truncate text-sm font-semibold text-ink">Администратор</p>
            <p class="truncate text-xs text-ink/50">Админ</p>
          </div>
        </div>
        <!-- action="#" — подставьте реальный url_for('logout') -->
        <form action="#" method="post" class="mt-3">
          <button type="submit"
                  class="flex w-full items-center justify-center gap-2 rounded-lg border border-ink/10 px-3 py-2 text-sm font-medium text-ink/70 transition hover:border-red-200 hover:bg-red-50 hover:text-red-600">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12H3m0 0 4-4m-4 4 4 4m8-12h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4" />
            </svg>
            Выйти
          </button>
        </form>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 p-8">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
