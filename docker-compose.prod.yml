services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: classapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - classapp_prod_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d classapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  web:
    image: ghcr.io/${REPO_OWNER}/classapp:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:8000"
    command: gunicorn -w 2 -b 0.0.0.0:8000 "app:create_app()"
    env_file:
      - .env
    environment:
      FLASK_CONFIG: config.ProdConfig
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/classapp
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL","/bin/sh -c 'wget -qO- http://localhost:9090/-/healthy || exit 1'"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL","/bin/sh -c 'wget -qO- http://localhost:3000/api/health || exit 1'"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  classapp_prod_db_data:
  prometheus_data:
  grafana_data:
