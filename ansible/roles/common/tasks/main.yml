---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - jq
      - python3
      - python3-pip
      - unzip
    state: present
    update_cache: true

# kubectl отдельно не качаем: dl.k8s.io резолвится только в IPv6, а с этой
# VM до него нет маршрута. Устанавливать не нужно — инсталлятор k3s сам
# создаёт симлинк /usr/local/bin/kubectl на свой бинарник (роль k3s ниже).

- name: Install Helm signing key
  ansible.builtin.get_url:
    url: https://packages.buildkite.com/helm-linux/helm-debian/any/helm.asc
    dest: /etc/apt/keyrings/helm.asc
    mode: "0644"
  register: helm_key_download
  retries: 5
  delay: 10
  until: helm_key_download is succeeded

- name: Add Helm repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/helm.asc] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    filename: helm-stable
    state: present

- name: Install Helm
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: true
