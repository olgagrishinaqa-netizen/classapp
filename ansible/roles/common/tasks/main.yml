---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - jq
      - python3
      - python3-pip
      - unzip
    state: present
    update_cache: true

# kubernetes.core.k8s/helm модули (роли bootstrap_secrets, monitoring) — это
# Python-модули, им нужна библиотека kubernetes на самом хосте, не только
# сам kubectl.
- name: Install Python kubernetes client library
  ansible.builtin.pip:
    name:
      - kubernetes
      - jsonpatch # часто требуется вместе с kubernetes.core.k8s для патчей
    executable: pip3

# kubectl отдельно не качаем — это лишняя точка отказа (сеть с этой VM
# периодически нестабильна для внешних HTTPS-загрузок, независимо от хоста).
# Устанавливать не нужно — инсталлятор k3s сам создаёт симлинк
# /usr/local/bin/kubectl на свой бинарник (роль k3s ниже).

- name: Create swap file
  ansible.builtin.command:
    cmd: "bash -c 'fallocate -l {{ swap_size_gb }}G /swapfile && chmod 600 /swapfile && mkswap /swapfile'"
    creates: /swapfile
  when: swap_size_gb | int > 0

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
  when: swap_size_gb | int > 0

- name: Activate swap
  ansible.builtin.shell: swapon --show=NAME --noheadings | grep -qx /swapfile || swapon /swapfile
  args:
    executable: /bin/bash
  changed_when: false
  when: swap_size_gb | int > 0
