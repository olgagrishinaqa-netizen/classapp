# Облегчённый профиль под ноду 2 vCPU (50%) / 4 ГБ RAM / HDD: на ней же живут
# k3s, Patroni x2, etcd, web x3, nginx x2 — мониторинг не должен съедать всё.

defaultRules:
  create: false # сотни стандартных PrometheusRule — лишняя нагрузка на HDD/CPU

alertmanager:
  enabled: false # алертинг для диплома не требуется, экономим RAM

# В k3s control plane встроен в один процесс — эти цели недоступны и просто
# висят как down, создавая лишние ServiceMonitor и скрейпы.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  enabled: true
  admin:
    existingSecret: classapp-grafana
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # После перезагрузки preemptible-ВМ Grafana стартует долго (SQLite на HDD,
  # миграции под лимитом CPU). Дефолтные пробы (readiness timeout 1s, liveness
  # 60s+10x10s) убивали её в цикле — даём время на старт и медленные ответы.
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 30
    failureThreshold: 20
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    scrapeInterval: 60s # вместо 30s — вдвое меньше записей на диск
    retention: 2d
    retentionSize: 2GB
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        cpu: 400m
        memory: 768Mi

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
    limits:
      cpu: 50m
      memory: 50Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
    limits:
      cpu: 100m
      memory: 100Mi
