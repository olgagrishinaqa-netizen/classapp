- name: Create monitoring namespace
  kubernetes.core.k8s:
    name: "{{ monitoring_namespace }}"
    api_version: v1
    kind: Namespace
    state: present
  environment:
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig }}"

- name: Install kube-prometheus-stack via K3s Helm controller
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: "{{ helm_release_name }}"
        namespace: kube-system
      spec:
        chart: kube-prometheus-stack
        repo: https://prometheus-community.github.io/helm-charts
        targetNamespace: "{{ monitoring_namespace }}"
        createNamespace: true
  environment:
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig }}"

- name: Configure kube-prometheus-stack values via K3s Helm controller
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: "{{ helm_release_name }}"
        namespace: kube-system
      spec:
        valuesContent: "{{ lookup('ansible.builtin.file', role_path + '/files/values.yaml') }}"
  environment:
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig }}"

# HelmChart CR применяется мгновенно, но сам chart k3s ставит асинхронно
# фоновой Job — раньше это ждал `wait: true` у kubernetes.core.helm, при
# переходе на HelmChart CRD эта гарантия исчезла. ServiceMonitor ниже —
# CRD, которую создаёт сам kube-prometheus-stack, поэтому явно ждём её.
- name: Wait for Prometheus Operator CRDs (ServiceMonitor) to be installed
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: servicemonitors.monitoring.coreos.com
  register: servicemonitor_crd
  retries: 30
  delay: 20
  until: servicemonitor_crd.resources | length > 0
  environment:
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig }}"

# kubernetes.core.k8s с src: читает файл на УДАЛЁННОМ хосте (модуль исполняется
# там же, где kubeconfig), а не на control-ноде — поэтому сначала копируем файл.
- name: Copy classapp monitoring resources manifest to remote host
  ansible.builtin.copy:
    src: "{{ role_path }}/files/classapp-monitoring.yaml"
    dest: /tmp/classapp-monitoring.yaml
    mode: "0644"

- name: Apply classapp monitoring resources
  kubernetes.core.k8s:
    state: present
    src: /tmp/classapp-monitoring.yaml
  environment:
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig }}"
