---
- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configure container registries mirrors for K3s
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0644"
    content: "{{ k3s_registries_config | to_nice_yaml(indent=2, sort_keys=false) }}"
  when: k3s_registries_config | length > 0
  register: k3s_registries_yaml

- name: Install K3s server on the first master
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      sh -s - server --write-kubeconfig-mode 644 --disable traefik
  args:
    creates: /usr/local/bin/k3s
    executable: /bin/bash
  environment:
    K3S_TOKEN: "{{ k3s_token }}"
  register: k3s_first_server_install
  retries: 3
  delay: 15
  until: k3s_first_server_install is succeeded
  when: inventory_hostname == groups['k3s_master'][0]

- name: Install K3s additional servers
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      sh -s - server --disable traefik
  args:
    creates: /usr/local/bin/k3s
    executable: /bin/bash
  environment:
    K3S_URL: "https://{{ k3s_api_endpoint }}:{{ k3s_api_port }}"
    K3S_TOKEN: "{{ k3s_token }}"
  register: k3s_additional_server_install
  retries: 3
  delay: 15
  until: k3s_additional_server_install is succeeded
  when:
    - inventory_hostname in groups['k3s_master']
    - inventory_hostname != groups['k3s_master'][0]

- name: Install K3s agents
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      sh -
  args:
    creates: /usr/local/bin/k3s
    executable: /bin/bash
  environment:
    K3S_URL: "https://{{ k3s_api_endpoint }}:{{ k3s_api_port }}"
    K3S_TOKEN: "{{ k3s_token }}"
  register: k3s_agent_install
  retries: 3
  delay: 15
  until: k3s_agent_install is succeeded
  when: inventory_hostname in groups['k3s_worker']

- name: Enable K3s services
  ansible.builtin.systemd:
    name: "{{ 'k3s' if inventory_hostname in groups['k3s_master'] else 'k3s-agent' }}"
    enabled: true
    state: started

- name: Restart K3s services to apply updated registries configuration
  ansible.builtin.systemd:
    name: "{{ 'k3s' if inventory_hostname in groups['k3s_master'] else 'k3s-agent' }}"
    state: restarted
  when:
    - k3s_registries_yaml is defined
    - k3s_registries_yaml is changed

- name: Wait for Kubernetes API on first master
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 120
  when: inventory_hostname == groups['k3s_master'][0]
