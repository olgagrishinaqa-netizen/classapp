[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
# Сеть до облака здесь бывает нестабильна (те же таймауты видели и у
# terraform) — увеличенный timeout снижает число ложных UNREACHABLE.
timeout = 30

[ssh_connection]
pipelining = True
retries = 3
ssh_args = -o ConnectTimeout=20 -o ServerAliveInterval=15
