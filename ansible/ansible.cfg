[defaults]
inventory = inventory/hosts.ini
roles_path = roles
# Отпечаток ВМ запоминается при первом подключении (accept-new, см. ssh_args) и дальше проверяется:
# при подмене сервера или смене ключа подключение прервётся. После пересоздания ВМ: ssh-keygen -R <IP>.
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
# Сеть до облака здесь бывает нестабильна (те же таймауты видели и у
# terraform) — увеличенный timeout снижает число ложных UNREACHABLE.
timeout = 30

[ssh_connection]
pipelining = True
retries = 3
# ControlPersist переиспользует одно TCP/SSH-соединение на весь прогон плейбука
# вместо новой сессии на каждую задачу — резко снижает число одновременных
# unauthenticated-подключений к sshd. Без этого повторные запуски плейбука
# (плюс ручные диагностические ssh) легко упираются в MaxStartups sshd
# (по умолчанию ~10 одновременных pre-auth соединений), и sshd начинает
# обрывать новые подключения на этапе kex_exchange_identification.
ssh_args = -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20-o ServerAliveInterval=15 -o ControlMaster=auto -o ControlPersist=120s -o ControlPath=~/.ansible/cp/%h-%p-%r
control_path_dir = ~/.ansible/cp
