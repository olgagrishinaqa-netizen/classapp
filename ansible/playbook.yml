---
- name: Prepare hosts and install K3s
  hosts: k3s_cluster
  become: true
  gather_facts: false
  vars_files:
    - group_vars/vault.yml  # <-- ДОБАВИЛИ СЮДА
  pre_tasks:
    - name: Wait for SSH connectivity before running roles
      ansible.builtin.wait_for_connection:
        timeout: 300
        connect_timeout: 10
        sleep: 5
        delay: 0
    - name: Gather facts after SSH is ready
      ansible.builtin.setup:
  roles:
    - common
    - k3s

- name: Bootstrap secrets and install Kubernetes monitoring stack
  hosts: k3s_master[0]
  become: true
  gather_facts: false
  vars_files:
    - group_vars/vault.yml  # <-- ДОБАВИЛИ СЮДА
  pre_tasks:
    - name: Wait for SSH connectivity before bootstrap roles
      ansible.builtin.wait_for_connection:
        timeout: 300
        connect_timeout: 10
        sleep: 5
        delay: 0
    - name: Gather facts after SSH is ready
      ansible.builtin.setup:
  roles:
    - bootstrap_secrets
    - monitoring