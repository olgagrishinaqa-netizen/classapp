---
# Ubuntu 22.04 (cloud image) не имеет /usr/bin/python (только python3) —
# автоопределение интерпретатора (interpreter_python=auto_silent) иногда
# промахивается мимо него, поэтому задаём путь явно.
ansible_python_interpreter: /usr/bin/python3
k3s_version: v1.30.8+k3s1
# k3s_token намеренно не хранится здесь в открытом виде — задавайте его через
# group_vars/secrets.yml (создаёт make configure, см. secrets.yml.example) либо флагом
# `-e k3s_token=$(openssl rand -hex 32)` при запуске playbook.
k3s_api_endpoint: "{{ hostvars[groups['k3s_master'][0]]['ansible_host'] }}"
k3s_api_port: 6443
monitoring_namespace: monitoring
helm_release_name: kube-prometheus-stack
kubeconfig: /etc/rancher/k3s/k3s.yaml
classapp_admin_phone: "375290000000"

# Зеркала registry не нужны: в AWS docker.io и ghcr.io доступны напрямую.
# Чтобы стабилизировать pull образов, задайте карту mirrors/configs:
# k3s_registries_config:
#   mirrors:
#     docker.io:
#       endpoint:
#         - "https://<your-mirror>"
k3s_registries_config: {}

# Мониторинг (kube-prometheus-stack) на ноде 2 ГБ вместе с Patroni и web не помещается:
# нода уходит в swap, API-сервер K3s не отвечает. По умолчанию выключен; на демонстрацию:
#   ansible-playbook ... -e monitoring_enabled=true   (или make configure MONITORING=true)
monitoring_enabled: false

# Размер swap-файла (ГБ): на ноде 2 ГБ RAM он страхует от OOM при пиках.
swap_size_gb: 2

# Бакет S3 для ночных бэкапов задаёт inventory (generate_inventory.sh ->
# classapp_backup_bucket). Не определён — роль backup пропускается.
