# Inventory for the classapp production VM.
# Replace ansible_host / ansible_user with your real server values,
# or override them at run time with --limit / -e / -i as needed.

[classapp_prod]
classapp-prod ansible_host=51.250.70.34 ansible_user=ubuntu

[classapp_prod:vars]
# Path to the SSH private key used to reach the server.
ansible_ssh_private_key_file=~/.ssh/id_rsa
# Note: the ports K3s must never touch (80, 3000, 5432) are defined as
# `protected_ports` directly in playbook.yml, since the INI inventory
# format cannot express a YAML list here.
