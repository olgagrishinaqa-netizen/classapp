apiVersion: v1
kind: ServiceAccount
metadata:
  name: classapp-patroni
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: classapp-patroni-role
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: classapp-patroni-rolebinding
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
subjects:
  - kind: ServiceAccount
    name: classapp-patroni
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: classapp-patroni-role
---
apiVersion: v1
kind: Service
metadata:
  name: classapp-patroni
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: patroni
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
    - name: patroni-api
      port: 8008
      targetPort: patroni-api
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: classapp-patroni
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
spec:
  serviceName: classapp-patroni
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: patroni
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patroni
        app.kubernetes.io/part-of: classapp
        patroni-role: replica
    spec:
      serviceAccountName: classapp-patroni
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
        - name: patroni
          image: bitnami/postgresql-ha:15.8.0-debian-12-r22
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_HA_MODE
              value: patroni
            - name: POSTGRESQL_HA_ETCD_HOSTS
              value: etcd-service:2379
            - name: POSTGRESQL_HA_PATRONI_SCOPE
              value: classapp-ha
            - name: POSTGRESQL_DATABASE
              value: classapp
            - name: POSTGRESQL_USERNAME
              value: postgres
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: POSTGRESQL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
            - name: patroni-api
              containerPort: 8008
              protocol: TCP
          volumeMounts:
            - name: patroni-data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name: role-labeler
          image: bitnamilegacy/kubectl:1.30.3
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                ROLE="$(wget -qO- http://127.0.0.1:8008 2>/dev/null | tr -d '\n' | sed -n 's/.*"role":"\([^"]*\)".*/\1/p')"
                if [ "$ROLE" = "leader" ]; then
                  kubectl label pod "$POD_NAME" -n "$POD_NAMESPACE" patroni-role=master --overwrite
                elif [ "$ROLE" = "replica" ]; then
                  kubectl label pod "$POD_NAME" -n "$POD_NAMESPACE" patroni-role=replica --overwrite
                fi
                sleep 10
              done
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: patroni-data
          emptyDir: {}
