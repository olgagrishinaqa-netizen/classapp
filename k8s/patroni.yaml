apiVersion: v1
kind: ServiceAccount
metadata:
  name: classapp-patroni
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: classapp-patroni-role
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/proxy
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: classapp-patroni-rolebinding
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
subjects:
  - kind: ServiceAccount
    name: classapp-patroni
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: classapp-patroni-role
---
apiVersion: v1
kind: Service
metadata:
  name: classapp-patroni
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: patroni
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
    - name: patroni-api
      port: 8008
      targetPort: patroni-api
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: classapp-patroni
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
spec:
  serviceName: classapp-patroni
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: patroni
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patroni
        app.kubernetes.io/part-of: classapp
        patroni-role: replica
    spec:
      serviceAccountName: classapp-patroni
      # fsGroup гарантирует, что emptyDir /data монтируется с правами на запись
      # для непривилегированного пользователя postgres (uid 1001) внутри
      # bitnami-образа, иначе первичная инициализация БД падает с Permission denied.
      securityContext:
        fsGroup: 1001
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      # Гарантированно выставляет владельца/права на volume до старта Patroni,
      # даже если fsGroup не применяется драйвером volume (emptyDir на некоторых
      # CSI/runtime это игнорирует).
      initContainers:
        - name: fix-data-permissions
          image: bitnamilegacy/postgresql-ha:15.8.0-debian-12-r22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data
              chown -R 1001:1001 /data
              chmod 0700 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: patroni-data
              mountPath: /data
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: patroni
          image: bitnamilegacy/postgresql-ha:15.8.0-debian-12-r22
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_HA_MODE
              value: patroni
            - name: POSTGRESQL_HA_ETCD_HOSTS
              value: etcd-service:2379
            - name: PATRONI_ETCD_HOSTS
              value: etcd-service:2379
            - name: POSTGRESQL_HA_PATRONI_SCOPE
              value: classapp-ha
            - name: POSTGRESQL_DATABASE
              value: classapp
            - name: POSTGRESQL_USERNAME
              value: postgres
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: POSTGRESQL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
            - name: patroni-api
              containerPort: 8008
              protocol: TCP
          volumeMounts:
            - name: patroni-data
              mountPath: /data
          # Первичная инициализация БД (initdb + запуск Patroni/etcd handshake)
          # может занимать до пары минут на слабых VM, поэтому initialDelaySeconds
          # достаточно велик, чтобы не убивать/не размечать pod NotReady раньше времени.
          readinessProbe:
            httpGet:
              path: /health
              port: patroni-api
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /liveness
              port: patroni-api
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name: role-labeler
          image: bitnamilegacy/kubectl:1.30.3
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                RESPONSE="$(kubectl get --raw "/api/v1/namespaces/${POD_NAMESPACE}/pods/${POD_NAME}:8008/proxy/" 2>/dev/null || true)"
                ROLE="$(printf '%s' "$RESPONSE" | tr -d '\n' | sed -n 's/.*"role"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
                if [ -z "$ROLE" ]; then
                  echo "role-labeler: patroni role is empty for pod ${POD_NAME}, retrying"
                  sleep 10
                  continue
                fi
                if [ "$ROLE" = "leader" ] || [ "$ROLE" = "primary" ] || [ "$ROLE" = "master" ]; then
                  kubectl label pod "$POD_NAME" -n "$POD_NAMESPACE" patroni-role=master --overwrite
                elif [ "$ROLE" = "replica" ] || [ "$ROLE" = "standby_leader" ]; then
                  kubectl label pod "$POD_NAME" -n "$POD_NAMESPACE" patroni-role=replica --overwrite
                else
                  echo "role-labeler: unsupported role '${ROLE}' for pod ${POD_NAME}, keeping current label"
                fi
                sleep 10
              done
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: patroni-data
          emptyDir: {}
