apiVersion: v1
kind: ServiceAccount
metadata:
  name: classapp-patroni
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: classapp-patroni-role
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/proxy
      - endpoints
      - services
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: classapp-patroni-rolebinding
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
subjects:
  - kind: ServiceAccount
    name: classapp-patroni
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: classapp-patroni-role
---
apiVersion: v1
kind: Service
metadata:
  name: classapp-patroni
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: patroni
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
    - name: patroni-api
      port: 8008
      targetPort: patroni-api
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: classapp-patroni
  namespace: default
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: classapp
spec:
  serviceName: classapp-patroni
  replicas: 2
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: patroni
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patroni
        app.kubernetes.io/part-of: classapp
        patroni-role: replica
    spec:
      serviceAccountName: classapp-patroni
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      initContainers:
        # Смонтированный PVC создаётся kubelet'ом от root, а postgres в
        # образе Spilo работает под uid=101(postgres):gid=103(postgres) —
        # без явного chown процесс не может ни создать, ни прочитать
        # PGDATA на этом томе. Важно ЗАРАНЕЕ создать сам каталог PGDATA:
        # стартовый (root) скрипт Spilo сам создаёт его при первом запуске
        # с правами 0700 root:root, и на этом моменте initContainer уже
        # не успевает вмешаться (он выполняется только один раз, до старта
        # основного контейнера, а не при каждом его рестарте).
        - name: fix-data-dir-perms
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data/pgroot/data && chown -R 101:103 /data"]
          volumeMounts:
            - name: patroni-data
              mountPath: /data
      containers:
        - name: patroni
          # ВАЖНО: используем тот же образ Zalando Spilo, что уже стабильно
          # работает в кластере (classapp-patroni-0 без единого сбоя 40+ часов).
          # Bitnami legacy-образы (bitnamilegacy/postgresql-ha) неоднократно
          # оказывались недоступны для pull (архивный registry, rate-limit),
          # что блокировало rollout всего StatefulSet. Spilo уже закэширован
          # на ноде и не требует сетевого pull.
          image: registry.opensource.zalan.do/acid/spilo-15:3.0-p1
          imagePullPolicy: IfNotPresent
          env:
            # ВАЖНО: Spilo генерирует Patroni config из переменных SCOPE/NAMESPACE,
            # а не из PATRONI_SCOPE/PATRONI_NAMESPACE. Имена PATRONI_* игнорируются
            # на этапе bootstrap у Spilo и приводят к scope: dummy.
            - name: SCOPE
              value: classapp-ha
            - name: NAMESPACE
              value: service
            - name: ETCD_HOSTS
              value: etcd-service:2379
            # ВАЖНО: образ Spilo игнорирует PATRONI_POSTGRESQL_DATA_DIR (это
            # переменная ванильного Patroni) и всегда пишет в свой собственный
            # путь по умолчанию /home/postgres/pgdata/pgroot/data — вне
            # смонтированного тома, то есть данные жили только во writable-слое
            # контейнера и терялись при каждом пересоздании пода. Spilo читает
            # именно PGDATA, и он должен указывать внутрь смонтированного /data.
            - name: PGDATA
              value: /data/pgroot/data
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: PGUSER_SUPERUSER
              value: postgres
            - name: PGPASSWORD_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: PATRONI_REPLICATION_USERNAME
              value: standby
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
            - name: patroni-api
              containerPort: 8008
              protocol: TCP
          volumeMounts:
            - name: patroni-data
              mountPath: /data
          # Первичная инициализация БД (initdb + запуск Patroni/etcd handshake)
          # может занимать до пары минут на слабых VM, поэтому initialDelaySeconds
          # достаточно велик, чтобы не убивать/не размечать pod NotReady раньше времени.
          readinessProbe:
            httpGet:
              path: /health
              port: patroni-api
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /liveness
              port: patroni-api
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
        - name: role-labeler
          image: bitnamilegacy/kubectl:1.30.3
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                RESPONSE="$(kubectl get --raw "/api/v1/namespaces/${POD_NAMESPACE}/pods/${POD_NAME}:8008/proxy/" 2>/dev/null || true)"
                ROLE="$(printf '%s' "$RESPONSE" | tr -d '\n' | sed -n 's/.*"role"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
                if [ -z "$ROLE" ]; then
                  echo "role-labeler: patroni role is empty for pod ${POD_NAME}, retrying"
                  sleep 10
                  continue
                fi
                if [ "$ROLE" = "leader" ] || [ "$ROLE" = "primary" ] || [ "$ROLE" = "master" ]; then
                  kubectl label pod "$POD_NAME" -n "$POD_NAMESPACE" patroni-role=master --overwrite
                elif [ "$ROLE" = "replica" ] || [ "$ROLE" = "standby_leader" ]; then
                  kubectl label pod "$POD_NAME" -n "$POD_NAMESPACE" patroni-role=replica --overwrite
                else
                  echo "role-labeler: unsupported role '${ROLE}' for pod ${POD_NAME}, keeping current label"
                fi
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
  volumeClaimTemplates:
    - metadata:
        name: patroni-data
        labels:
          app.kubernetes.io/name: patroni
          app.kubernetes.io/part-of: classapp
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
