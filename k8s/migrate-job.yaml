apiVersion: batch/v1
kind: Job
metadata:
  # __JOB_NAME__ подставляется в CI коротким SHA коммита, чтобы каждый релиз
  # создавал свой уникальный Job и не конфликтовал с предыдущими прогонами.
  name: __JOB_NAME__
  namespace: default
  labels:
    app.kubernetes.io/name: classapp-migrate
    app.kubernetes.io/part-of: classapp
spec:
  # Автоматическая очистка завершенных Job через 5 минут после финиша —
  # не нужно вручную удалять старые записи миграций.
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classapp-migrate
        app.kubernetes.io/part-of: classapp
    spec:
      restartPolicy: Never
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      initContainers:
        - name: db-ready-check
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h classapp-db-master -p 5432 -U postgres; do
                echo "Waiting for PostgreSQL at classapp-db-master:5432..."
                sleep 2
              done
              echo "PostgreSQL is ready"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
      containers:
        - name: classapp-migrate
          # __IMAGE__ подставляется в CI на новый образ приложения, который еще
          # не был раскатан в deployment/classapp-web — миграции применяются
          # к схеме БД до того, как новая версия веб-пода начнет разворачиваться.
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: POSTGRES_HOST
              value: classapp-db-master
            - name: POSTGRES_DB
              value: classapp
            - name: POSTGRES_USER
              value: postgres
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: secret-key
