apiVersion: batch/v1
kind: Job
metadata:
  name: classapp-migrate
  namespace: default
  labels:
    app.kubernetes.io/name: classapp-migrate
    app.kubernetes.io/part-of: classapp
spec:
  # Держим статус и логи дольше для упрощения диагностики после деплоя.
  ttlSecondsAfterFinished: 3600
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classapp-migrate
        app.kubernetes.io/part-of: classapp
    spec:
      restartPolicy: Never
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      initContainers:
        - name: db-ready-check
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h classapp-db-master -p 5432 -U postgres; do
                echo "Waiting for PostgreSQL at classapp-db-master:5432..."
                sleep 2
              done
              echo "PostgreSQL is ready"
              # Образ Spilo (в отличие от bitnami/postgresql-ha) не создает
              # прикладную БД автоматически из переменных окружения — делаем
              # это здесь идемпотентно перед запуском Alembic.
              psql "postgresql://postgres:${PGPASSWORD}@classapp-db-master:5432/postgres?sslmode=require" \
                -tc "SELECT 1 FROM pg_database WHERE datname = 'classapp'" | grep -q 1 \
                || psql "postgresql://postgres:${PGPASSWORD}@classapp-db-master:5432/postgres?sslmode=require" \
                     -c "CREATE DATABASE classapp"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
      containers:
        - name: classapp-migrate
          # Базовый тег заменяется в CI через `kubectl set image` на образ текущего коммита.
          image: ghcr.io/olgagrishinaqa-netizen/classapp:latest
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: database-url
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: POSTGRES_HOST
              value: classapp-db-master
            - name: POSTGRES_DB
              value: classapp
            - name: POSTGRES_USER
              value: postgres
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: secret-key
