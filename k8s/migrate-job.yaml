apiVersion: batch/v1
kind: Job
metadata:
  # __JOB_NAME__ подставляется в CI коротким SHA коммита, чтобы каждый релиз
  # создавал свой уникальный Job и не конфликтовал с предыдущими прогонами.
  name: __JOB_NAME__
  namespace: default
  labels:
    app.kubernetes.io/name: classapp-migrate
    app.kubernetes.io/part-of: classapp
spec:
  # Автоматическая очистка завершенных Job через 5 минут после финиша —
  # не нужно вручную удалять старые записи миграций.
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classapp-migrate
        app.kubernetes.io/part-of: classapp
    spec:
      restartPolicy: Never
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
        - name: classapp-migrate
          # __IMAGE__ подставляется в CI на новый образ приложения, который еще
          # не был раскатан в deployment/classapp-web — миграции применяются
          # к схеме БД до того, как новая версия веб-пода начнет разворачиваться.
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: DATABASE_URL
              value: postgresql://postgres:$(DB_PASSWORD)@classapp-db-master:5432/classapp
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: secret-key
