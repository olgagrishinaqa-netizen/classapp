apiVersion: v1
kind: ConfigMap
metadata:
  name: classapp-nginx-config
  namespace: default
  labels:
    app.kubernetes.io/name: classapp-nginx
    app.kubernetes.io/part-of: classapp
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log notice;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format nginx_json escape=json
            '{"time": "$time_local", '
            '"remote_addr": "$remote_addr", '
            '"request_method": "$request_method", '
            '"request_uri": "$request_uri", '
            '"status": "$status", '
            '"body_bytes_sent": "$body_bytes_sent", '
            '"upstream_response_time": "$upstream_response_time"}';

        access_log /var/log/nginx/access.json.log nginx_json;
        sendfile on;
        keepalive_timeout 65;
        client_max_body_size 20m;

        # Единая точка входа: приложение на «/», Grafana на «/grafana/».
        # CoreDNS в K3s. Адрес Grafana задан через переменную + resolver, чтобы
        # nginx стартовал, даже если мониторинг ещё не поднят (иначе он падает
        # с "host not found in upstream" и роняет доступ к самому приложению).
        resolver 10.43.0.10 valid=10s ipv6=off;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 8080;
            server_name _;

            location = /grafana {
                return 301 /grafana/;
            }

            location /grafana/ {
                set $grafana_upstream kube-prometheus-stack-grafana.monitoring.svc.cluster.local;
                proxy_pass http://$grafana_upstream:80;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_read_timeout 60s;
            }

            location / {
                proxy_pass http://classapp-web-service:8000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";
                proxy_read_timeout 60s;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classapp-nginx
  namespace: default
  labels:
    app.kubernetes.io/name: classapp-nginx
    app.kubernetes.io/part-of: classapp
spec:
  # 1 реплика: контейнер занимает порт 80 самого хоста (hostPort) напрямую,
  # чтобы сайт открывался по обычному адресу без порта — а хост у нас один
  # (единственная нода кластера), и два пода не могут забронировать один и
  # тот же порт 80 хоста одновременно.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: classapp-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classapp-nginx
        app.kubernetes.io/part-of: classapp
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-host
              containerPort: 8080
              hostPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-logs
              mountPath: /var/log/nginx
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: nginx-config
          configMap:
            name: classapp-nginx-config
        - name: nginx-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: classapp-nginx
  namespace: default
  labels:
    app.kubernetes.io/name: classapp-nginx
    app.kubernetes.io/part-of: classapp
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: classapp-nginx
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
