apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: default
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: classapp
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd
        app.kubernetes.io/part-of: classapp
    spec:
      # runAsGroup НЕ задаём: в образе bitnami каталог данных доступен группе 0 (gid процесса по умолчанию);
      # с runAsGroup: 1001 процесс терял эту группу, не мог писать данные и etcd зависал при старте.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: etcd
          image: bitnamilegacy/etcd:3.5.11-debian-11-r0
          imagePullPolicy: IfNotPresent
          # Образ bitnami работает под uid 1001. readOnlyRootFilesystem не включаем: его
          # entrypoint при старте пишет конфиг в /opt/bitnami (см. .trivyignore.yaml).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: ALLOW_NONE_AUTHENTICATION
              value: "yes"
            - name: ETCD_ENABLE_V2
              value: "true"
            - name: ETCD_NAME
              value: etcd
            - name: ETCD_INITIAL_CLUSTER
              value: etcd=http://127.0.0.1:2380
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: http://127.0.0.1:2380
            - name: ETCD_LISTEN_PEER_URLS
              value: http://0.0.0.0:2380
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "http://etcd-service:2379"
            - name: ETCD_LISTEN_CLIENT_URLS
              value: "http://0.0.0.0:2379"
          ports:
            - name: client
              containerPort: 2379
              protocol: TCP
            - name: peer
              containerPort: 2380
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-service
  namespace: default
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: classapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: etcd
  ports:
    - name: client
      port: 2379
      targetPort: client
      protocol: TCP
