apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: default
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: classapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd
        app.kubernetes.io/part-of: classapp
    spec:
      containers:
        - name: etcd
          image: bitnamilegacy/etcd:3.5.11-debian-11-r0
          imagePullPolicy: IfNotPresent
          env:
            - name: ALLOW_NONE_AUTHENTICATION
              value: "yes"
            - name: ETCD_ENABLE_V2
              value: "true"
            - name: ETCD_NAME
              value: etcd
            - name: ETCD_INITIAL_CLUSTER
              value: etcd=http://127.0.0.1:2380
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: http://127.0.0.1:2380
            - name: ETCD_LISTEN_PEER_URLS
              value: http://0.0.0.0:2380
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "http://etcd-service:2379"
            - name: ETCD_LISTEN_CLIENT_URLS
              value: "http://0.0.0.0:2379"
          ports:
            - name: client
              containerPort: 2379
              protocol: TCP
            - name: peer
              containerPort: 2380
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-service
  namespace: default
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: classapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: etcd
  ports:
    - name: client
      port: 2379
      targetPort: client
      protocol: TCP
