apiVersion: apps/v1
kind: Deployment
metadata:
  name: classapp-web
  namespace: default
  labels:
    app.kubernetes.io/name: classapp-web
    app.kubernetes.io/part-of: classapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: classapp-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classapp-web
        app.kubernetes.io/part-of: classapp
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      initContainers:
        - name: fix-log-dir-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /var/log/classapp /uploads"]
          volumeMounts:
            - name: classapp-logs
              mountPath: /var/log/classapp
            - name: classapp-uploads
              mountPath: /uploads
      containers:
        - name: classapp-web
          image: ghcr.io/olgagrishinaqa-netizen/classapp:latest
          imagePullPolicy: IfNotPresent
          args: ["gunicorn", "-w", "2", "-b", "0.0.0.0:8000", "app:create_app()"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: database-url
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: POSTGRES_HOST
              value: classapp-db-master
            - name: POSTGRES_DB
              value: classapp
            - name: POSTGRES_USER
              value: postgres
            - name: ADMIN_PHONE
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: admin-phone
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: admin-password
                  optional: true
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: secret-key
            - name: APP_JSON_LOG_PATH
              value: /var/log/classapp/app.json.log
            - name: UPLOAD_FOLDER
              value: /uploads
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: classapp-logs
              mountPath: /var/log/classapp
            - name: classapp-uploads
              mountPath: /uploads
            # Форма /expenses сохраняет чеки по захардкоженному в коде пути
            # app.root_path/static/uploads (а не через UPLOAD_FOLDER) —
            # монтируем тот же постоянный том и туда, чтобы обе точки загрузки
            # писали на один и тот же диск на хосте.
            - name: classapp-uploads
              mountPath: /app/app/static/uploads
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: classapp-logs
          hostPath:
            path: /var/log/classapp
            type: DirectoryOrCreate
        - name: classapp-uploads
          hostPath:
            path: /var/lib/classapp/uploads
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: classapp-web-service
  namespace: default
  labels:
    app.kubernetes.io/name: classapp-web
    app.kubernetes.io/part-of: classapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: classapp-web
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
