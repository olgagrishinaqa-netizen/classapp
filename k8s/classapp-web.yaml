apiVersion: apps/v1
kind: Deployment
metadata:
  name: classapp-web
  namespace: default
  labels:
    app.kubernetes.io/name: classapp-web
    app.kubernetes.io/part-of: classapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: classapp-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classapp-web
        app.kubernetes.io/part-of: classapp
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
        - name: classapp-web
          image: ghcr.io/olgagrishinaqa-netizen/classapp:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: database-url
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: db-password
            - name: POSTGRES_HOST
              value: classapp-db-master
            - name: POSTGRES_DB
              value: classapp
            - name: POSTGRES_USER
              value: postgres
            - name: ADMIN_PHONE
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: admin-phone
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: admin-password
                  optional: true
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: classapp-secrets
                  key: secret-key
            - name: APP_JSON_LOG_PATH
              value: /var/log/classapp/app.json.log
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: classapp-logs
              mountPath: /var/log/classapp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: classapp-logs
          hostPath:
            path: /var/log/classapp
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: classapp-web-service
  namespace: default
  labels:
    app.kubernetes.io/name: classapp-web
    app.kubernetes.io/part-of: classapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: classapp-web
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
