services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: classapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      FLASK_CONFIG: config.DevConfig
      SECRET_KEY: dev-secret
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/classapp
    ports:
      - "8080:8000"
    depends_on:
      - db
    command: >
      bash -c "pip install -r requirements.txt &&
      flask --app app run --host 0.0.0.0 --port 8000 --debug"

volumes:
  db_data:
